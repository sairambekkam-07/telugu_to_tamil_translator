<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Telugu to Tamil Translator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 15px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .result p {
            font-size: 22px;
        }

        .error {
            margin-top: 20px;
            color: red;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Telugu → Tamil Translator</h1>


    <form method="POST">

        <label>
            Enter Telugu Text
        </label>

        <textarea
            name="telugu_text"
            placeholder="తెలుగులో టైప్ చేయండి..."
        >{{ telugu_text }}</textarea>


        <button type="submit">
            Translate
        </button>

    </form>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    {% if tamil_text %}

        <div class="result">

            <h2>Tamil Translation</h2>

            <p>
                {{ tamil_text }}
            </p>

        </div>

    {% endif %}


</div>

</body>

</html>
